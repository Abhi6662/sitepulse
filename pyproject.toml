[tool.poetry]
name = "sitepulse"
version = "0.1.0"
description = "Technical SEO audit CLI and library"
authors = ["Abhishek Mandloi <163866821+Abhi6662@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "sitepulse", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.0.0"
click = "^8.1.0"
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"

[tool.poetry.scripts]
sitepulse = "sitepulse.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
